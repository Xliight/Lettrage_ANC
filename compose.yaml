version: '3.8'

services:
  db:
    image: postgres:latest
    container_name: postgres_container
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: root
    ports:
      - "3000:5432"
      - "4000:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: always
    networks:
      - my

  spring-app:
#    build:
#      context: .
#      dockerfile: Dockerfile
    image: spring:latest  # Use the pre-built image
    container_name: spring-app
    ports:
      - "8080:8080"
    depends_on:
      - db
    networks:
      - my

networks:
  my:
    driver: bridge

volumes:
  postgres_data:
